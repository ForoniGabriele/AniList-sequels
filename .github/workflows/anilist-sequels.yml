# Salvalo come .github/workflows/anilist-sequels.yml nel tuo repo
name: AniList sequels to Planning

on:
  schedule:
    - cron: "0 7 * * 1"   # ogni lunedi' alle 07:00 UTC
  workflow_dispatch:       # permette anche l'avvio manuale

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python anilist_sequels.py
        env:
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
